<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반별 기록하기 · 우리 학교 탄소 대시보드</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1d2b25;
      --muted: #5f6f68;
      --green: #2e7d5b;
      --green-dark: #1f5c42;
      --green-light: #e3f1ea;
      --line: #dde6e1;
      --red: #b54a3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo { font-weight: 700; color: var(--green-dark); text-decoration: none; }
    .menu { display: flex; gap: 16px; flex-wrap: wrap; }
    .menu a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    .menu a:hover, .menu a.active { color: var(--green); font-weight: 600; }

    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .lead { color: var(--muted); margin-bottom: 24px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 1.05rem; margin-bottom: 12px; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    select, input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .device {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .device:last-child { border-bottom: none; }
    .device-name { font-weight: 600; }
    .device-name small { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--green-dark);
    }
    .stepper button:active { background: var(--green-light); }
    .stepper output { min-width: 64px; text-align: center; font-weight: 700; font-size: 1.05rem; }

    .preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat { background: var(--bg); border-radius: 10px; padding: 14px; }
    .stat b { display: block; font-size: 1.4rem; color: var(--green-dark); }
    .stat span { color: var(--muted); font-size: 0.85rem; }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .submit:hover { background: var(--green-dark); }
    .error { color: var(--red); font-size: 0.9rem; margin-top: 8px; min-height: 1.4em; }

    .done {
      display: none;
      background: var(--green-light);
      border: 1px solid #bcdccb;
      border-radius: 14px;
      padding: 20px;
      margin-top: 16px;
    }
    .done h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--green-dark); }
    .done ul { padding-left: 18px; margin-bottom: 10px; }
    .done p { color: var(--muted); font-size: 0.9rem; }
    .note { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="index.html">🌱 탄소 대시보드</a>
      <div class="menu">
        <a href="index.html#features">기능</a>
        <a href="index.html#calculator">계산기</a>
        <a href="index.html#how">작동 원리</a>
        <a href="record.html" class="active">반별 기록</a>
      </div>
    </div>
  </nav>

  <main>
    <h1>반별 기록하기</h1>
    <p class="lead">하루 한 번, 수업이 끝난 뒤 오늘 우리 반 기기 사용 시간을 기록해 주세요.</p>

    <div class="panel">
      <h2>1. 우리 반과 날짜</h2>
      <div class="row">
        <div class="field">
          <label for="grade">학년</label>
          <select id="grade"></select>
        </div>
        <div class="field">
          <label for="classNo">반</label>
          <select id="classNo"></select>
        </div>
      </div>
      <div class="field">
        <label for="date">날짜</label>
        <input type="date" id="date">
      </div>
    </div>

    <div class="panel">
      <h2>2. 오늘 켠 시간</h2>
      <div id="devices"></div>
      <p class="note">0.5시간(30분) 단위로 기록해요. 대략적인 시간이면 충분해요.</p>
    </div>

    <div class="panel">
      <h2>3. 미리보기</h2>
      <div class="preview">
        <div class="stat"><b id="kwh">0.0</b><span>전력 사용량 (kWh)</span></div>
        <div class="stat"><b id="co2">0.0</b><span>탄소 배출량 (kg CO₂)</span></div>
      </div>
    </div>

    <button class="submit" id="submit">기록 제출하기</button>
    <div class="error" id="error"></div>

    <div class="done" id="done">
      <h2>기록이 준비됐어요</h2>
      <ul id="summary"></ul>
      <p>저장 기능은 곧 연결될 예정이에요. 지금은 기록 내용 확인까지만 가능해요.</p>
    </div>
  </main>

  <script>
    // ===== 설정: 학교에 맞게 바꾸는 부분 =====
    const GRADES = [1, 2, 3];          // 학년 목록
    const CLASSES_PER_GRADE = 8;       // 학년당 반 수
    const MAX_HOURS = 12;              // 기기별 최대 입력 시간
    const EMISSION_FACTOR = 0.4173;    // kg CO2 / kWh (2023년도 국가 전력배출계수)
    // 소비전력(kW)은 예시 값. 실제 기기 모델 확인 후 수정.
    const devices = [
      { id: "ac",    name: "에어컨",            kw: 3.0 },
      { id: "heat",  name: "난방기",            kw: 3.0 },
      { id: "light", name: "조명",              kw: 0.6 },
      { id: "proj",  name: "프로젝터·전자칠판", kw: 0.3 }
    ];
    // =======================================

    const hours = {};
    devices.forEach(d => hours[d.id] = 0);

    // 학년·반 선택지 만들기
    const gradeSel = document.getElementById("grade");
    const classSel = document.getElementById("classNo");
    gradeSel.innerHTML = '<option value="">선택</option>' +
      GRADES.map(g => '<option value="' + g + '">' + g + '학년</option>').join("");
    let classOptions = '<option value="">선택</option>';
    for (let c = 1; c <= CLASSES_PER_GRADE; c++) {
      classOptions += '<option value="' + c + '">' + c + '반</option>';
    }
    classSel.innerHTML = classOptions;

    // 날짜 기본값: 오늘
    const dateInput = document.getElementById("date");
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    dateInput.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
    dateInput.max = dateInput.value;

    // 기기별 +/- 입력 만들기
    const box = document.getElementById("devices");
    devices.forEach(d => {
      const row = document.createElement("div");
      row.className = "device";
      row.innerHTML =
        '<div class="device-name">' + d.name + '<small>소비전력 약 ' + d.kw + ' kW</small></div>' +
        '<div class="stepper">' +
          '<button type="button" aria-label="' + d.name + ' 30분 줄이기" data-id="' + d.id + '" data-step="-0.5">−</button>' +
          '<output id="out-' + d.id + '">0시간</output>' +
          '<button type="button" aria-label="' + d.name + ' 30분 늘리기" data-id="' + d.id + '" data-step="0.5">+</button>' +
        '</div>';
      box.appendChild(row);
    });

    box.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const id = btn.dataset.id;
      const next = hours[id] + parseFloat(btn.dataset.step);
      hours[id] = Math.min(MAX_HOURS, Math.max(0, next));
      document.getElementById("out-" + id).textContent = hours[id] + "시간";
      update();
    });

    function totals() {
      let kwh = 0;
      devices.forEach(d => kwh += d.kw * hours[d.id]);
      return { kwh: kwh, co2: kwh * EMISSION_FACTOR };
    }

    function update() {
      const t = totals();
      document.getElementById("kwh").textContent = t.kwh.toFixed(1);
      document.getElementById("co2").textContent = t.co2.toFixed(1);
      document.getElementById("done").style.display = "none";
    }

    document.getElementById("submit").addEventListener("click", () => {
      const err = document.getElementById("error");
      err.textContent = "";
      if (!gradeSel.value || !classSel.value) {
        err.textContent = "학년과 반을 선택해 주세요.";
        return;
      }
      if (!dateInput.value) {
        err.textContent = "날짜를 선택해 주세요.";
        return;
      }
      const t = totals();
      const record = {
        grade: Number(gradeSel.value),
        classNo: Number(classSel.value),
        date: dateInput.value,
        hours: Object.assign({}, hours),
        kwh: Number(t.kwh.toFixed(2)),
        co2: Number(t.co2.toFixed(2))
      };

      const list = document.getElementById("summary");
      list.innerHTML =
        "<li>" + record.grade + "학년 " + record.classNo + "반 · " + record.date + "</li>" +
        devices.map(d => "<li>" + d.name + ": " + record.hours[d.id] + "시간</li>").join("") +
        "<li>전력 " + record.kwh + " kWh · 탄소 " + record.co2 + " kg CO₂</li>";
      document.getElementById("done").style.display = "block";
    });

    update();
  </script>

</body>
</html>
